error_log               /var/log/nginx/error.log warn;
pid                     /tmp/nginx.pid;
worker_processes        auto;
worker_rlimit_nofile    65535;

events {
    worker_connections  1024;
}

http {
    server_tokens off;

    client_body_buffer_size 2m;

    client_header_buffer_size 16k;
    large_client_header_buffers 8 32k;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }


    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for" '
                    'req_id=$req_id';

    log_format trace
        'time=$time_iso8601 '
        'req_id=$req_id '
        'remote=$remote_addr '
        'xff="$http_x_forwarded_for" '
        'host="$host" server_name="$server_name" '
        'method=$request_method uri="$uri" args="$args" '
        'request="$request" status=$status bytes_sent=$body_bytes_sent '
        'req_len=$request_length '
        'ref="$http_referer" ua="$http_user_agent" '
        'proto=$server_protocol scheme=$scheme '
        'cl="$http_content_length" ct="$http_content_type" '
        'hdr_host="$http_host" '
        'up_status=$upstream_status up_addr="$upstream_addr" '
        'up_rt=$upstream_response_time rt=$request_time';

    proxy_connect_timeout   60;
    proxy_read_timeout      60;
    proxy_send_timeout      60;


    # INTERNAL-ONLY listener: jobs.callimacus.ai sits behind an internal
    # (VPN-only) ALB — the network is the exposure boundary, enforced by the
    # ALB/SG/subnet config in solomei-infra, not here.
    server {
        listen        8080;
        access_log /dev/stdout main;
        access_log /dev/stdout trace;

        # CV/resume uploads go through the app's document endpoints.
        client_max_body_size  25M;


        client_header_timeout 60;
        client_body_timeout   60;
        keepalive_timeout     60;

        gzip                  on;
        gzip_comp_level       4;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        location / {
            proxy_pass          http://127.0.0.1:3000;
            proxy_http_version  1.1;

            proxy_set_header X-Request-Id $req_id;
            add_header       X-Request-Id $req_id always;

            proxy_set_header    Connection          $connection_upgrade;
            proxy_set_header    Upgrade             $http_upgrade;
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;

            proxy_buffers       16      16k;
            proxy_buffer_size   16k;
        }
    }
}
